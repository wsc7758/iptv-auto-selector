name: IPTV 优选

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 13:00 = 北京时间 21:00
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 启用 pip 缓存，加速依赖安装
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg static binary
        run: |
          # 从 BtbN/FFmpeg-Builds 下载静态编译的 ffmpeg（含 ffprobe）
          # 比 apt-get 快 5-10 倍，无需 apt-get update
          set -e
          FFMPEG_DIR="$HOME/ffmpeg-static"
          mkdir -p "$FFMPEG_DIR"

          # 检查是否已有缓存（同一 runner 复用时命中）
          if [ -x "$FFMPEG_DIR/ffmpeg" ] && [ -x "$FFMPEG_DIR/ffprobe" ]; then
            echo "ffmpeg 已缓存，跳过下载"
          else
            echo "下载静态 ffmpeg 二进制..."
            URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            curl -sL "$URL" -o /tmp/ffmpeg.tar.xz
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg "$FFMPEG_DIR/"
            cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe "$FFMPEG_DIR/"
            chmod +x "$FFMPEG_DIR/ffmpeg" "$FFMPEG_DIR/ffprobe"
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl
          fi

          # 验证
          "$FFMPEG_DIR/ffmpeg" -version | head -1
          "$FFMPEG_DIR/ffprobe" -version | head -1

          # 写入 GITHUB_ENV 供后续步骤使用
          echo "FFMPEG_PATH=$FFMPEG_DIR/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$FFMPEG_DIR/ffprobe" >> "$GITHUB_ENV"

      - name: Run IPTV selector
        env:
          # 关键：禁用 Python 输出缓冲，确保 GitHub Actions 实时显示日志
          PYTHONUNBUFFERED: "1"
          # ffmpeg/ffprobe 路径（由上一步设置）
          FFMPEG_PATH: ${{ env.FFMPEG_PATH }}
          FFPROBE_PATH: ${{ env.FFPROBE_PATH }}
          # 阶段一 HTTP 测速参数
          STREAM_TEST_WORKERS: "10"
          PRETEST_MAX_PER_CHANNEL: "80"
          MAX_TOTAL_TEST_URLS: "4000"
          CONNECT_TIMEOUT: "3"
          READ_TIMEOUT: "6"
          TEST_STAGE_MAX_SECONDS: "1800"
          SINGLE_URL_MAX_SECONDS: "12"
          DIRECT_READ_BYTES: "524288"
          SEGMENT_READ_BYTES: "262144"
          MIN_VALID_BYTES: "16384"
          # 多分片测速：测试 2 个分片取平均，比单分片更准确
          M3U8_SEGMENT_TEST_COUNT: "2"
          # 阶段二 ffprobe 精测参数
          FFPROBE_ENABLED: "1"
          # 增加到 8：更多候选获得精测数据，为后续筛选留余量
          FFPROBE_TOP_N: "8"
          FFPROBE_TIMEOUT: "8"
          # 阶段二.5 持续稳定性测试（0=关闭）
          SUSTAINED_TEST_SECONDS: "0"
          # 阶段三：实际播放验证（黑屏/冻结帧/静音/播放速率检测）
          PLAYBACK_VALIDATION_ENABLED: "1"
          # 增加到 8：与 ffprobe 对齐，更多候选经过播放验证
          PLAYBACK_VALIDATE_TOP_N: "8"
          # 解码 5 秒：更长的时间让 ffmpeg 输出更稳定的 speed= 值
          PLAYBACK_TEST_SECONDS: "5"
          PLAYBACK_BLACK_THRESHOLD: "3"
          PLAYBACK_TIMEOUT: "20"
          M3U8_AD_DISCONTINUITY_THRESHOLD: "3"
          # 频道名校验：通过 service_name + URL 路径交叉校验
          CHANNEL_NAME_VERIFY_ENABLED: "1"
          # 分辨率过滤：丢弃 1080P 以下
          MIN_HEIGHT: "1080"
          # CDN 多样性：0=关闭（纯粹按速度排序），1=开启（优先不同CDN提高容灾）
          CDN_DIVERSITY_ENABLED: "0"
          # 评分权重（速度优先：速度权重最高）
          W_AVAILABILITY: "0.20"
          W_QUALITY: "0.15"
          W_SPEED: "0.40"
          W_LATENCY: "0.15"
          W_STABILITY: "0.10"
          # 输出
          KEEP_PER_CHANNEL: "5"
        run: python main.py

      - name: Commit outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update IPTV playlists"
          file_pattern: "output/** config/history.json"
