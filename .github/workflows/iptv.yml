名称：IPTV自动选择器: IPTV Auto Selector

在::
  工作流程_派发::
  时间表::
    - cron: "15 22 * * *"cron: "15 22 * * *"

权限：:
  内容：写: write

工作::
  构建::
    运行于: ubuntu-latest: ubuntu-latest
    超时时间（分钟）：45: 45

    步骤：:
      - 名称: 结账name: Checkout
        用途：actions/checkout@v4: actions/checkout@v4

      - name: 安装Pythonname: Setup Python
        用途：actions/setup-python@v5: actions/setup-python@v5
        与：:
          python-version: "3.11": "3.11"

      - name: 安装依赖项name: Install dependencies
        运行：pip install -r requirements.txt: pip install -r requirements.txt

      - 名称: 运行IPTV选择器name: Run IPTV selector
        环境::
          源下载工作进程: "6": "6"
          STREAM_TEST_WORKERS: "10": "10"
          每个通道保持："3": "3"
          预测试最大值每通道: "80": "80"
          连接超时: "3": "3"
          读取超时: "6": "6"
        run: python -u main.py: python main.py

      - name: Commit outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update IPTV playlist"
          file_pattern: "output/*.m3u output/*.txt output/*.json config/history.json"
