name: IPTV Auto Selector

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IPTV selector
        env:
          SOURCE_DOWNLOAD_WORKERS: "6"
          STREAM_TEST_WORKERS: "8"
          KEEP_PER_CHANNEL: "5"
          PRETEST_MAX_PER_CHANNEL: "50"
          MAX_TOTAL_TEST_URLS: "2500"
          CONNECT_TIMEOUT: "3"
          READ_TIMEOUT: "5"
          SOURCE_STAGE_MAX_SECONDS: "150"
          TEST_STAGE_MAX_SECONDS: "1500"
          SINGLE_URL_MAX_SECONDS: "10"
          SOURCE_MAX_BYTES: "3145728"
          DIRECT_READ_BYTES: "262144"
          SEGMENT_READ_BYTES: "131072"
          MIN_VALID_BYTES: "8192"
          M3U8_SEGMENT_TEST_COUNT: "1"
        run: python main.py

      - name: Commit outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update IPTV playlist"
          file_pattern: "output/*.m3u output/*.txt output/*.json config/history.json"
