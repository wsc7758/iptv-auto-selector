name: IPTV自动选择器: IPTV Auto Selector

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IPTV selector
        env:
          SOURCE_DOWNLOAD_WORKERS: "6"
          STREAM_TEST_WORKERS: "8"
          KEEP_PER_CHANNEL: "3"
          PRETEST_MAX_PER_CHANNEL: "80"
          CONNECT_TIMEOUT: "3"
          READ_TIMEOUT: "6"
        # 关键：-u 无缓冲，实时输出print日志
        run: python -u main.py

      - name: Commit outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update IPTV playlist"
          file_pattern: "output/*.m3u output/*.txt output/*.json config/history.json"
